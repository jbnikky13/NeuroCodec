name: NeuroCodec Final Benchmark
on:
  push:
    tags: ["v1.0.0"]
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/run_final_benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: neurocodec-final-benchmark
          path: artifacts/final-benchmark.json
